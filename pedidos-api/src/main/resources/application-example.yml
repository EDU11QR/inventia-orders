# =========================================================
# EJEMPLO DE CONFIGURACIÓN - copiar a application.yml
#
# VARIABLES DE ENTORNO REQUERIDAS (sin valores por defecto):
#   export DB_USER=tu_usuario
#   export DB_PASSWORD=tu_password
#   export WHATSAPP_API_KEY=clave-compartida-con-el-listener
#   export JWT_SECRET=cadena-aleatoria-de-al-menos-32-caracteres
#
# La misma WHATSAPP_API_KEY debe ir en el .env del listener
# (ver whatsapp-listener/.env.example)
# =========================================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tu_base_datos
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

app:
  security:
    api-key: ${WHATSAPP_API_KEY}
    jwt-secret: ${JWT_SECRET}
